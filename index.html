    <script>
      ;(function () {
        var guardado = localStorage.getItem('cca-tema')
        var tema =
          guardado === 'light' || guardado === 'dark'
            ? guardado
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = tema
      })()
    </script>
