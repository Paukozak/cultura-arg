<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Aplica el tema guardado (o el del sistema) antes del primer pintado:
         sin esto, la página siempre arranca en oscuro y recién cambia a
         claro después de que React monta — un flash visible del tema
         equivocado. Bloqueante a propósito, por eso va tan arriba. -->
    <script>
      ;(function () {
        var guardado = localStorage.getItem('cca-tema')
        var tema =
          guardado === 'light' || guardado === 'dark'
            ? guardado
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = tema
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Arranca antes la conexión (DNS+TLS) al mapa de Google embebido que
         se usa al abrir el panel de una provincia — así, cuando el código
         realmente lo pide, la conexión ya está lista en vez de arrancar de
         cero. -->
    <link rel="preconnect" href="https://maps.google.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>CulturArg</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
